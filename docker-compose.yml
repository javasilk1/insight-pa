version: '3.9'
services:
  quartu-postgres:
    platform: linux/amd64  # ← FORZA AMD64 (emulazione)

    image: postgis/postgis:15-3.3
    
    container_name: quartu-postgres
    environment:
      POSTGRES_USER: quartu_user
      POSTGRES_PASSWORD: quartu_pass
      POSTGRES_DB: quartu_abusivismo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quartu_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quartu-network

  backend:
    build: ./backend
    container_name: quartu-backend
    depends_on:
      quartu-postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://quartu_user:quartu_pass@quartu-postgres:5432/quartu_abusivismo
      - QDRANT_URL=http://qdrant:6333
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=quartu_user
      - MINIO_SECRET_KEY=quartu_pass_secure_12345
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app
      - ./backend/scripts:/app/scripts
      - ./init-db:/init-db
      - ./mock_data:/mock_data
    networks:
      - quartu-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: quartu-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - quartu-network

  minio:
    image: minio/minio:latest
    container_name: quartu-minio
    environment:
      MINIO_ROOT_USER: quartu_user
      MINIO_ROOT_PASSWORD: quartu_pass_secure_12345
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - quartu-network

  frontend:
    build: ./frontend
    container_name: quartu-frontend
    depends_on:
      - backend
    ports:
      - "3001:80"
    networks:
      - quartu-network

volumes:
  postgres_data:
  qdrant_data:
  minio_data:

networks:
  quartu-network:
    driver: bridge
