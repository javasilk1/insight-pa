version: '3.9'
services:
  postgres:
    platform: linux/amd64  # ← FORZA AMD64 (emulazione)

    image: postgis/postgis:15-3.3
    
    container_name: insightpa-postgres
    environment:
      POSTGRES_USER: insightpa_user
      POSTGRES_PASSWORD: insightpa_pass
      POSTGRES_DB: insightpa_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightpa_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - insightpa-network

  backend:
    build: ./backend
    container_name: insightpa-backend
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://insightpa_user:insightpa_pass@postgres:5432/insightpa_db
      - QDRANT_URL=http://qdrant:6333
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=insightpa_user
      - MINIO_SECRET_KEY=insightpa_pass_secure_12345
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app
      - ./backend/scripts:/app/scripts
      - ./init-db:/init-db
      - ./mock_data:/mock_data
    networks:
      - insightpa-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: insightpa-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - insightpa-network

  minio:
    image: minio/minio:latest
    container_name: insightpa-minio
    environment:
      MINIO_ROOT_USER: insightpa_user
      MINIO_ROOT_PASSWORD: insightpa_pass_secure_12345
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - insightpa-network

  frontend:
    build: ./frontend
    container_name: insightpa-frontend
    depends_on:
      - backend
    ports:
      - "3001:80"
    networks:
      - insightpa-network

volumes:
  postgres_data:
  qdrant_data:
  minio_data:

networks:
  insightpa-network:
    driver: bridge
